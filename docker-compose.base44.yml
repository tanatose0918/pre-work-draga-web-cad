services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000 --strictPort"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) throw new Error('Frontend returned ' + r.status); return r.text(); }).then(t => { if (!t.includes('/src/main.ts')) throw new Error('Frontend source entry missing'); }).catch(e => { console.error(e.message); process.exit(1); })"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  node_modules:
